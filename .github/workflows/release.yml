# Family Chat iOS release pipeline (#6, docs/RELEASING.md). A tag v<upstream version>-fc.<n> on familychat:
# - builds and signs the app with its notification service and share extensions (Xcode automatic signing through an
#   App Store Connect API key: certificates and profiles are created and managed by Apple),
# - uploads it to App Store Connect, where it becomes a TestFlight build,
# - publishes a GitHub pre-release with the dSYMs, a CycloneDX SBOM, SHA256SUMS and build provenance attestations.
# The App Store Connect key is in the protected `release` environment (Rob is the required reviewer), used by the build
# job only: one approval per release. The Team ID comes from the organisation secret APPLE_TEAM_ID.

name: Release

on:
  push:
    tags: [ 'v*-fc.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build again, e.g. v26.09.1-fc.1'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      fc: ${{ steps.tag.outputs.fc }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag, its branch and its CI
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: ./.github/workflows/scripts/release-gate.sh

  build:
    name: Build, sign and upload to TestFlight
    needs: gate
    runs-on: macos-26
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    steps:
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Setup environment
        run: source ci_scripts/ci_common.sh && setup_github_actions_environment
      # Apple grants com.apple.developer.usernotifications.filtering on request only. Until it is granted (repo variable
      # IOS_NSE_FILTERING_ENTITLEMENT = granted), the extension is signed without it: notifications it would have
      # discarded then show the generic "Notification" alert instead (docs/RELEASING.md).
      - name: Leave out the notification filtering entitlement until Apple grants it
        if: vars.IOS_NSE_FILTERING_ENTITLEMENT != 'granted'
        run: |
          sed -i '' '/com.apple.developer.usernotifications.filtering: true/d' NSE/SupportingFiles/target.yml
          if grep -q usernotifications.filtering NSE/SupportingFiles/target.yml; then
            echo "::error::could not remove the filtering entitlement from NSE/SupportingFiles/target.yml"
            exit 1
          fi
      - name: Generate the Xcode project
        run: xcodegen
      - name: Archive and upload
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          # Unique and increasing for every upload of a version, re-runs included.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set (docs/RELEASING.md)"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key_path"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          set -o pipefail
          # Signed for distribution straight away: a development-signed archive would need a registered device.
          xcodebuild archive \
            -project ElementX.xcodeproj \
            -scheme ElementX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FamilyChat.xcarchive" \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify -q --disable-logging --is-ci --renderer github-actions

          # destination=upload: exporting sends the build straight to App Store Connect (TestFlight).
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FamilyChat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" \
            | xcbeautify -q --disable-logging --is-ci --renderer github-actions
          echo "::notice::Uploaded ${VERSION} (${BUILD_NUMBER}) to App Store Connect"
      - name: Collect the dSYMs
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/FamilyChat.xcarchive/dSYMs" "dist/familychat-ios-$TAG-dSYMs.zip"
      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.gate.outputs.tag }}
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub pre-release
    needs: [ gate, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.gate.outputs.tag }}
          path: dist
      # The Swift packages the app is built from (Package.resolved).
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/familychat-ios-${{ needs.gate.outputs.tag }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write the release notes
        env:
          TAG: ${{ needs.gate.outputs.tag }}
        run: ./.github/workflows/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Create or update the pre-release
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$REPO"
          else
            gh release create "$TAG" dist/* --prerelease --verify-tag \
              --title "Family Chat for iOS $TAG" --notes-file "$RUNNER_TEMP/notes.md" --repo "$REPO"
          fi
