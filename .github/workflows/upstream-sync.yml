name: Upstream sync

# Merges each new stable element-hq/element-x-ios release into familychat on an upstream/<version> branch and opens a
# pull request, or an `upstream-sync` issue when the merge conflicts. It never merges into familychat: a person
# reviews every upstream merge. See "Merging upstream releases" in the README.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to merge (release/YY.MM.N). Default: the latest stable release.'
        required: false
        type: string
      dry_run:
        description: 'Only report what would be pushed and opened'
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge the latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the sync app's credentials, and only deploys from familychat.
    environment: upstream-sync
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: familychat
          fetch-depth: 0
          persist-credentials: false
          # Screenshots are LFS pointers. The merge only needs the pointers, and the fork shares upstream's LFS objects.
          lfs: false

      # An installation token minted from the upstream-sync GitHub App (UPSTREAM_APP_ID / UPSTREAM_APP_PRIVATE_KEY
      # in the upstream-sync environment), limited to this repository: contents, pull requests and issues write.
      # Pushes made with GITHUB_TOKEN would not trigger CI on the pull request; App pushes do.
      - name: Mint the sync app's installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
          # Scope the minted token to what the sync does; a bare installation token would inherit
          # all the app's permissions.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Merge and open a pull request or an issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::the sync GitHub App token could not be minted (check UPSTREAM_APP_ID and UPSTREAM_APP_PRIVATE_KEY in the upstream-sync environment)"
            exit 1
          fi
          ./.github/workflows/scripts/upstream-sync.sh
