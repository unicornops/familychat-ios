disabled_rules:
  - trailing_whitespace
  - unused_setter_value
  - redundant_discardable_let
  - identifier_name
  - void_function_in_ternary

opt_in_rules:
  - force_unwrapping
  - private_action
  - explicit_init
  - shorthand_optional_binding
  - trailing_closure

included:
  - "*/Sources/*"
  - Tools/Scripts/Templates
excluded:
  - "*/Sources/Generated/*"
  - Tools/Sources # Our command-line tools use a lot of print commands.
  - Components/Secrets
  - compound-ios/Inspector

line_length:
  warning: 250
  error: 1000

file_length:
  warning: 2000

type_name:
  min_length: 3
  max_length:
    warning: 150
    error: 1000

type_body_length:
  warning: 1000
  error: 1000

function_body_length:
  warning: 100
  error: 100

function_parameter_count:
  warning: 10
  error: 10

cyclomatic_complexity:
  ignores_case_statements: true

nesting:
  type_level:
    warning: 5

custom_rules:
  vstack_spacing:
    regex: "(?-s)VStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in VStacks."
    severity: warning

  hstack_spacing:
    regex: "(?-s)HStack((?!spacing:).)*\\s*\\{"
    match_kinds: identifier
    message: "Please use explicit spacing in HStacks."
    severity: warning

  compound_color_conversion:
    regex: "UIColor\\(\\.compound"
    match_kinds: identifier
    message: "Please use the UIColor token directly to ensure the colour scheme is honoured."
    severity: warning

  # Family Chat: the parental gate (family-chat#232 decision 10). A regex can't catch every aliased or
  # multi-line call, so reviews still need to look for new ways of opening URLs.
  external_url_open:
    regex: "(\\bUIApplication\\s*\\.shared\\s*\\.open\\b|\\bapplication\\s*\\.open\\s*\\(|\\bSFSafariViewController\\b|\\bLink\\s*\\(|\\.systemAction\\b)"
    match_kinds: identifier
    message: "Family Chat: links out of the app must use ParentalGate.openExternalURL or AppMediatorProtocol.open (Kids Category parental gate, family-chat#232 decision 10)."
    severity: error

  embedded_browser:
    regex: "\\b(ASWebAuthenticationSession|WKWebView)\\s*\\("
    match_kinds: identifier
    excluded:
      - "ElementX/Sources/Screens/Authentication/OAuthAuthenticationPresenter\\.swift"
      - "ElementX/Sources/Screens/Settings/AccountSettings/OAuthAccountSettingsPresenter\\.swift"
      - "ElementX/Sources/Screens/CallScreen/View/CallScreen\\.swift"
    message: "Family Chat: a new web view or web authentication session can leave the app without the parental gate; review it and add it to this rule's allowlist."
    severity: error

  print_deprecation:
    regex: "\\b(print)\\b"
    match_kinds: identifier
    message: "MXLog should be used instead of print()"
    severity: error

  print_ln_deprecation:
    regex: "\\b(println)\\b"
    match_kinds: identifier
    message: "MXLog should be used instead of println()"
    severity: error

  os_log_deprecation:
    regex: "\\b(os_log)\\b"
    match_kinds: identifier
    message: "MXLog should be used instead of os_log()"
    severity: error

  prefer_element_navigation_stack:
    regex: "\\b(NavigationStack)\\b"
    match_kinds: identifier
    message: "Use ElementNavigationStack instead of NavigationStack"
    severity: error
    included: "ElementX/Sources/.*\\.swift"
    excluded: "ElementNavigationStack.swift"
